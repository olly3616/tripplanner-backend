spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/voyage?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:voyage}
    password: ${DB_PASSWORD:voyage}

  jpa:
    properties:
      hibernate:
        format_sql: true

voyage:
  jwt:
    # Local-only default secret (48 bytes). NEVER use this in dev/prod.
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789-abcdef-0123}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
