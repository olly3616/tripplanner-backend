spring:
  application:
    name: voyage-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # All timestamps are stored and exchanged in UTC; clients render in the trip timezone.
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

voyage:
  jwt:
    # HS256 secret must be at least 32 bytes. Provided via env in dev/prod.
    secret: ${JWT_SECRET:}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL:900}          # 15 minutes
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:1209600}    # 14 days

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
